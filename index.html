<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSTEP – Tan.ed</title>
<link rel="stylesheet" href="kieu.css">
<link rel="icon" href="logo.png">
</head>
<body>
<header class="dau">
  <div class="khung">
    <img class="logo" src="logo.png" alt="VSTEP" style="object-fit:cover;background:none">
    <div>
      <h1>VSTEP</h1>
      <p>Tan.ed</p>
    </div>
  </div>
</header>

<main class="khung">
  <section class="thong-ke" aria-label="Thống kê">
    <div class="o-so"><b id="soTruyCap">…</b><span>Lượt truy cập</span></div>
    <div class="o-so"><b id="soLamBai">…</b><span>Lượt làm bài</span></div>
    <div class="o-so"><b id="soBai">…</b><span>Bài tập</span></div>
  </section>

  <p class="luu-y"><b>Người phụ trách nội dung:</b> <a href="https://www.facebook.com/1x3bkmrr/" target="_blank" rel="noopener">Trang Facebook</a><br>
  <b>Cộng đồng trên Zalo:</b> <a href="https://zalo.me/g/evls8y06p64xpntnjiop" target="_blank" rel="noopener">Tham gia nhóm Zalo</a></p>

  <input id="oTim" class="tim" type="search" placeholder="Tìm bài…" aria-label="Tìm bài">
  <ul id="dsBai" class="ds-bai"></ul>
  <p id="thongBao" class="thong-bao">Đang tải danh sách bài…</p>
</main>

<footer>VSTEP</footer>

<script src="chung.js"></script>
<script>
(function () {
  var CAP_NHAT_SAU = 5 * 60 * 1000;   // tự cập nhật số mỗi 5 phút
  var oTruyCap = document.getElementById("soTruyCap");
  var oLamBai  = document.getElementById("soLamBai");
  var ul = document.getElementById("dsBai");
  var tb = document.getElementById("thongBao");
  var oTim = document.getElementById("oTim");
  var KHOA_DS = "vstep-ds-hien-" + khongGianDem();

  // 1) Hiện NGAY số đã nhớ từ lần trước (không phải chờ)
  hienSoNgay(oTruyCap, "truy-cap");
  hienSoNgay(oLamBai, "lam-bai-tong");

  // 2) Đếm lượt truy cập: mỗi phiên trình duyệt tính 1 lượt
  if (!docTam("sessionStorage", "vstep-da-dem")) {
    luuTam("sessionStorage", "vstep-da-dem", "1");
    demTang("truy-cap").then(function (n) { oTruyCap.textContent = dinhDangSo(n); });
  } else {
    docSoDem("truy-cap").then(function (n) { oTruyCap.textContent = dinhDangSo(n); });
  }
  docSoDem("lam-bai-tong").then(function (n) { oLamBai.textContent = dinhDangSo(n); });

  // 3) Danh sách bài: hiện ngay danh sách đã nhớ, rồi cập nhật
  function veDanhSach(ds) {
    ds = ds.slice().sort(function (a, b) { return a.file.localeCompare(b.file, "vi", { numeric: true }); });
    document.getElementById("soBai").textContent = ds.length;
    ul.innerHTML = "";
    if (!ds.length) { tb.style.display = ""; tb.textContent = "Chưa có bài tập nào."; return; }
    tb.style.display = "none";

    ds.forEach(function (muc, i) {
      var li = document.createElement("li");
      li.dataset.tim = vietTat(muc.file) + " " + vietTat(muc.title || "");
      li.dataset.khoa = khoaBai(muc.file);
      var a = document.createElement("a");
      a.href = "lam-bai.html?bai=" + encodeURIComponent(muc.file);
      a.innerHTML =
        '<span class="so-tt">' + (i + 1) + '</span>' +
        '<span class="ten-bai"><strong></strong><small>Đã làm: <span class="dl">…</span> lượt</small></span>' +
        '<span class="nut-lam">Làm bài</span>';
      a.querySelector("strong").textContent = muc.title || tenTuFile(muc.file);
      hienSoNgay(a.querySelector(".dl"), li.dataset.khoa);
      li.appendChild(a);
      ul.appendChild(li);
    });
    locTheoTuKhoa();
  }

  function giaiMa(t) {
    var tam = document.createElement("textarea");
    tam.innerHTML = t;
    return tam.value;
  }

  function capNhatSoTungBai() {
    Array.prototype.forEach.call(ul.children, function (li) {
      var o = li.querySelector(".dl");
      docSoDem(li.dataset.khoa).then(function (n) { o.textContent = dinhDangSo(n); });
    });
  }

  var dsCu = null;
  try { dsCu = JSON.parse(docTam("localStorage", KHOA_DS) || "null"); } catch (e) {}
  if (Array.isArray(dsCu) && dsCu.length) veDanhSach(dsCu);

  layDanhSachBai().then(function (ds) {
    // lấy tên bài: dùng tên đã nhớ nếu có, thiếu thì đọc từ file
    var nhoTen = {};
    (dsCu || []).forEach(function (m) { if (m.title) nhoTen[m.file] = m.title; });
    return Promise.all(ds.map(function (m) {
      if (m.title) return { file: m.file, title: giaiMa(m.title) };
      return layTieuDe(m.file).then(function (t) { return { file: m.file, title: t || nhoTen[m.file] || "" }; });
    }));
  }).then(function (ds) {
    if (!ds.length && Array.isArray(dsCu) && dsCu.length) ds = dsCu; // lỗi tạm thời: giữ danh sách cũ
    luuTam("localStorage", KHOA_DS, JSON.stringify(ds));
    veDanhSach(ds);
    capNhatSoTungBai();
  });

  // 4) Tự cập nhật các con số mỗi 5 phút
  setInterval(function () {
    docSoDem("truy-cap").then(function (n) { oTruyCap.textContent = dinhDangSo(n); });
    docSoDem("lam-bai-tong").then(function (n) { oLamBai.textContent = dinhDangSo(n); });
    capNhatSoTungBai();
  }, CAP_NHAT_SAU);

  // 5) Ô tìm bài
  function locTheoTuKhoa() {
    var q = vietTat(oTim.value);
    Array.prototype.forEach.call(ul.children, function (li) {
      li.style.display = !q || li.dataset.tim.indexOf(q) !== -1 ? "" : "none";
    });
  }
  oTim.addEventListener("input", locTheoTuKhoa);
})();
</script>
</body>
</html>
